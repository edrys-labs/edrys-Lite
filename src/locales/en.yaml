    dismiss: "Dismiss"
    title: "Your account has been upgraded to the new identity system."
    body: "Your classrooms are ready to use. Teacher lists have been reset — please re-add your teachers."
  storage:
    title: "Your classrooms are stored only in this browser."
    body: "If you clear the site data, they are gone. Download a backup in each classroom under ⚙️ Settings → Import / Export. A class restored after that gets a new link, so share it again."
  classroom:
    title: "Your classrooms"
    saved: "{n} saved in this browser"
    create: "Create a class"
    createHint: "Start empty, or from a ready-made lab: Arduino, Calliope mini, simulators and more."
    newClass: "My New Class"
    welcome:
      teacher: |
        # Welcome to your new classroom 👋

        This panel is a module. You can change or remove it any time in **⚙️ Settings → Modules**.

        **Set up your classroom** in **⚙️ Settings**, next to the class name in the rooms menu:

        1. **Main**: name the class, add a description and a logo, and choose how many rooms it starts with.
        2. **Members**: copy the **Class link** to invite people. Add teachers by their public key (everyone can copy theirs from the ⋮ menu). Leave students empty to let anyone with the link join.
        3. **Modules**: add the tools your class needs (code editor, terminal, Markdown, …) with **Explore modules**, or paste a module URL. Open a module's settings to change its content, its size and the rooms it appears in.
        4. **Stations**: open the station link on a computer connected to your lab hardware or camera. It joins the class as its own room, and students can enter it.
        5. **Import / Export**: download a backup of your class, or restore one from a file or a link.
        6. **Communication**: only needed when your network blocks direct connections.

        ℹ️ There is no central server: your class lives in this browser, and everyone connects directly to each other. Download a backup in **Import / Export** now and then.

        📚 Read the [documentation](https://liascript.github.io/course/?https://raw.githubusercontent.com/edrys-labs/documentation/refs/heads/main/README.md) to learn more.
      student: |
        # Welcome 👋

        Your teacher hasn't set up this classroom yet. Please check back later.
