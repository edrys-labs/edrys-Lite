index:
  migration:
    dismiss: "إغلاق"
    title: "تم ترقية حسابك إلى نظام الهوية الجديد."
    body: "فصولك الدراسية جاهزة للاستخدام. تم إعادة تعيين قوائم المعلمين — يرجى إعادة إضافة معلميك."
  storage:
    title: "فصولك الدراسية محفوظة في هذا المتصفح فقط."
    body: "إذا مسحت بيانات الموقع فستفقدها. نزّل نسخة احتياطية من كل فصل عبر ⚙️ الإعدادات ← استيراد / تصدير. يحصل الفصل المستعاد بعد ذلك على رابط جديد، لذا شاركه مرة أخرى."
  classroom:
    title: "فصولك الدراسية"
    saved: "المحفوظة في هذا المتصفح: {n}"
    create: "إنشاء فصل دراسي"
    createHint: "ابدأ بفصل فارغ أو بمختبر جاهز: Arduino وCalliope mini والمحاكيات وغيرها."
    newClass: "فصلي الجديد"
    welcome:
      teacher: |
        # مرحبًا بك في فصلك الجديد 👋

        هذه اللوحة وحدة. يمكنك تغييرها أو إزالتها في أي وقت من **⚙️ الإعدادات ← الوحدات**.

        **جهّز فصلك** من **⚙️ الإعدادات**، بجانب اسم الفصل في قائمة الغرف:

        1. **الرئيسية**: سمِّ الفصل، وأضف وصفًا وشعارًا، واختر عدد الغرف التي يبدأ بها.
        2. **الأعضاء**: انسخ **رابط الفصل** لدعوة الآخرين. أضف المعلمين بمفاتيحهم العامة (يمكن لكل شخص نسخ مفتاحه من القائمة ⋮). اترك قائمة الطلاب فارغة ليتمكن أي شخص لديه الرابط من الانضمام.
        3. **الوحدات**: أضف الأدوات التي يحتاجها فصلك (محرر الشيفرة، الطرفية، Markdown، …) عبر **استكشاف الوحدات**، أو الصق رابط وحدة. في إعدادات الوحدة تغيّر محتواها وحجمها والغرف التي تظهر فيها.
        4. **المحطات**: افتح رابط المحطة على حاسوب متصل بأجهزة المختبر أو بكاميرا. ينضم إلى الفصل كغرفة مستقلة، ويمكن للطلاب دخولها.
        5. **استيراد / تصدير**: نزّل نسخة احتياطية من فصلك، أو استعد واحدة من ملف أو رابط.
        6. **الاتصال**: لا تحتاجه إلا إذا كانت شبكتك تحظر الاتصالات المباشرة.

        💡 لا يوجد خادم مركزي: يعيش فصلك في هذا المتصفح، ويتصل الجميع ببعضهم مباشرة. نزّل نسخة احتياطية من **استيراد / تصدير** بين الحين والآخر.

        📚 اقرأ [التوثيق](https://liascript.github.io/course/?https://raw.githubusercontent.com/edrys-labs/documentation/refs/heads/main/README.md) لمعرفة المزيد.
      student: |
        # مرحبًا 👋

        لم يُجهّز معلمك هذا الفصل بعد. يُرجى العودة لاحقًا.
    ownership:
      owner: "أنت تمتلك هذا الفصل"
      teacher: "أنت معلم هنا"
      student: "أنت طالب هنا"
