index:
  migration:
    dismiss: "Schließen"
    title: "Ihr Konto wurde auf das neue Identitätssystem aktualisiert."
    body: "Ihre Unterrichtsräume sind bereit. Die Lehrerlisten wurden zurückgesetzt — bitte fügen Sie Ihre Lehrer erneut hinzu."
  storage:
    title: "Deine Klassenräume sind nur in diesem Browser gespeichert."
    body: "Wenn du die Websitedaten löschst, sind sie weg. Lade in jedem Klassenraum unter ⚙️ Einstellungen → Import / Export eine Sicherung herunter. Eine danach wiederhergestellte Klasse bekommt einen neuen Link, teile ihn also erneut."
  classroom:
    title: "Ihre Unterrichtsräume"
    saved: "{n} in diesem Browser gespeichert"
    create: "Klasse erstellen"
    createHint: "Leer beginnen oder mit einem fertigen Labor: Arduino, Calliope mini, Simulatoren und mehr."
    newClass: "Meine neue Klasse"
    welcome:
      teacher: |
        # Willkommen in deiner neuen Klasse 👋

        Dieses Feld ist ein Modul. Du kannst es jederzeit unter **⚙️ Einstellungen → Module** ändern oder entfernen.

        **Richte deine Klasse ein** unter **⚙️ Einstellungen**, neben dem Klassennamen im Raummenü:

        1. **Haupt**: Gib der Klasse einen Namen, eine Beschreibung und ein Logo, und lege fest, mit wie vielen Räumen sie startet.
        2. **Mitglieder**: Kopiere den **Link zur Klasse**, um Leute einzuladen. Füge Lehrkräfte über ihren öffentlichen Schlüssel hinzu (jede Person kann ihren eigenen im ⋮-Menü kopieren). Lass die Liste der Studierenden leer, damit alle mit dem Link beitreten können.
        3. **Module**: Füge die Werkzeuge hinzu, die deine Klasse braucht (Code-Editor, Terminal, Markdown, …), über **Module erkunden** oder per Modul-URL. In den Einstellungen eines Moduls änderst du Inhalt, Größe und die Räume, in denen es erscheint.
        4. **Stationen**: Öffne den Stations-Link auf einem Computer, der mit deiner Laborhardware oder Kamera verbunden ist. Er tritt der Klasse als eigener Raum bei, und Studierende können ihn betreten.
        5. **Import / Export**: Lade eine Sicherung deiner Klasse herunter oder stelle eine aus einer Datei oder über einen Link wieder her.
        6. **Kommunikation**: nur nötig, wenn dein Netzwerk direkte Verbindungen blockiert.

        ℹ️ Es gibt keinen zentralen Server: Deine Klasse liegt in diesem Browser, und alle verbinden sich direkt miteinander. Lade ab und zu unter **Import / Export** eine Sicherung herunter.

        📚 Mehr erfährst du in der [Dokumentation](https://liascript.github.io/course/?https://raw.githubusercontent.com/edrys-labs/documentation/refs/heads/main/README.md).
      student: |
        # Willkommen 👋

        Deine Lehrkraft hat diese Klasse noch nicht eingerichtet. Bitte schau später noch einmal vorbei.
    ownership:
      owner: "Sie besitzen diese Klasse"
      teacher: "Sie sind hier Lehrer"
      student: "Sie sind hier Student"
