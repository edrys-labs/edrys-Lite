    title: "Tu cuenta ha sido actualizada al nuevo sistema de identidad."
    body: "Tus clases están listas para usar. Las listas de profesores han sido restablecidas — por favor, vuelve a añadir a tus profesores."
  storage:
    title: "Tus clases se guardan solo en este navegador."
    body: "Si borras los datos del sitio, se perderán. Descarga una copia de seguridad en cada clase desde ⚙️ Configuración → Importar / Exportar. Una clase restaurada después recibe un enlace nuevo, así que compártelo de nuevo."
  classroom:
    title: "Tus aulas"
    saved: "Guardadas en este navegador: {n}"
    create: "Crear una clase"
    createHint: "Empieza con una clase vacía o con un laboratorio listo: Arduino, Linux, ROS y más."
    newClass: "Mi Nueva Clase"
    welcome:
      teacher: |
        # Bienvenido a tu nueva clase 👋

        Este panel es un módulo. Puedes cambiarlo o quitarlo en cualquier momento en **⚙️ Configuración → Módulos**.

        **Prepara tu clase** en **⚙️ Configuración**, junto al nombre de la clase en el menú de salas:

        1. **Principal**: ponle un nombre a la clase, añade una descripción y un logo, y elige con cuántas salas empieza.
        2. **Miembros**: copia el **Enlace de la clase** para invitar a la gente. Añade profesores con su clave pública (cada persona puede copiar la suya desde el menú ⋮). Deja vacía la lista de estudiantes para que cualquiera con el enlace pueda unirse.
        3. **Módulos**: añade las herramientas que necesita tu clase (editor de código, terminal, Markdown, …) con **Explorar módulos**, o pega la URL de un módulo. En los ajustes de un módulo cambias su contenido, su tamaño y las salas en las que aparece.
        4. **Estaciones**: abre el enlace de estación en un ordenador conectado al hardware o a la cámara de tu laboratorio. Se une a la clase como una sala propia, y los estudiantes pueden entrar en ella.
        5. **Importar / Exportar**: descarga una copia de seguridad de tu clase, o restaura una desde un archivo o un enlace.
        6. **Comunicación**: solo hace falta si tu red bloquea las conexiones directas.

        ℹ️ No hay un servidor central: tu clase vive en este navegador y todos se conectan directamente entre sí. Descarga de vez en cuando una copia de seguridad en **Importar / Exportar**.

        📚 Lee la [documentación](https://liascript.github.io/course/?https://raw.githubusercontent.com/edrys-labs/documentation/refs/heads/main/README.md) para saber más.
      student: |
        # Bienvenido 👋

        Tu profesor todavía no ha preparado esta clase. Vuelve a intentarlo más tarde.
