    dismiss: "Закрити"
    title: "Ваш обліковий запис оновлено до нової системи ідентифікації."
    body: "Ваші класи готові до використання. Списки викладачів скинуто — будь ласка, додайте викладачів знову."
  storage:
    title: "Ваші класи зберігаються лише в цьому браузері."
    body: "Якщо ви очистите дані сайту, вони зникнуть. Завантажте резервну копію в кожному класі: ⚙️ Налаштування → Імпорт / Експорт. Клас, відновлений після цього, отримує нове посилання, тож поділіться ним ще раз."
  classroom:
    title: "Ваші класи"
    saved: "Збережено в цьому браузері: {n}"
    create: "Створити клас"
    createHint: "Почніть з порожнього класу або з готової лабораторії: Arduino, Calliope mini, симулятори тощо."
    newClass: "Мій новий клас"
    welcome:
      teacher: |
        # Ласкаво просимо до вашого нового класу 👋

        Ця панель — модуль. Ви можете будь-коли змінити або видалити її в **⚙️ Налаштування → Модулі**.

        **Налаштуйте клас** у **⚙️ Налаштування**, поруч із назвою класу в меню кімнат:

        1. **Головне**: дайте класу назву, додайте опис і логотип та виберіть, зі скількох кімнат він починається.
        2. **Користувачі**: скопіюйте **Посилання на клас**, щоб запросити людей. Додайте вчителів за їхнім публічним ключем (кожен може скопіювати свій у меню ⋮). Залиште список студентів порожнім, щоб будь-хто з посиланням міг приєднатися.
        3. **Модулі**: додайте потрібні класу інструменти (редактор коду, термінал, Markdown, …) через **Досліджуйте модулі** або вставте URL модуля. У налаштуваннях модуля можна змінити його вміст, розмір і кімнати, де він з'являється.
        4. **Станції**: відкрийте посилання станції на комп'ютері, підключеному до лабораторного обладнання або камери. Він приєднується до класу як окрема кімната, і студенти можуть до неї зайти.
        5. **Імпорт / Експорт**: завантажте резервну копію класу або відновіть її з файлу чи за посиланням.
        6. **Спілкування**: потрібне лише тоді, коли ваша мережа блокує прямі з'єднання.

        ℹ️ Центрального сервера немає: ваш клас зберігається в цьому браузері, а всі учасники з'єднуються безпосередньо один з одним. Час від часу завантажуйте резервну копію в **Імпорт / Експорт**.

        📚 Докладніше читайте в [документації](https://liascript.github.io/course/?https://raw.githubusercontent.com/edrys-labs/documentation/refs/heads/main/README.md).
      student: |
        # Ласкаво просимо 👋

        Ваш викладач ще не налаштував цей клас. Будь ласка, загляньте пізніше.
    ownership:
      owner: "Ви власник цього класу"
      teacher: "Ви тут викладач"
      student: "Ви тут студент"
