    title: "Ваш обліковий запис оновлено до нової системи ідентифікації."
    body: "Ваші класи готові до використання. Списки викладачів скинуто — будь ласка, додайте викладачів знову."
  storage:
    title: "Ваші класи зберігаються лише в цьому браузері."
    body: "Якщо ви очистите дані сайту, вони зникнуть. Завантажте резервну копію в кожному класі: ⚙️ Налаштування → Поділитися. Відновлена копія отримує нове посилання, тож надішліть його студентам ще раз."
  classroom:
    title: "Ваші класи"
    saved: "Збережено в цьому браузері: {n}"
    create: "Створити клас"
    createHint: "Порожній клас, власником якого є ви. Додавайте модулі, кімнати й студентів будь-коли."
    newClass: "Мій новий клас"
    welcome:
      teacher: |
        # Ласкаво просимо до вашого нового класу 👋

        Ця панель — модуль. Ви можете будь-коли змінити або видалити її в **⚙️ Налаштування → Модулі**.

        **Налаштуйте свій клас** (відкрийте **⚙️ Налаштування** поруч із назвою класу):

        1. **Головне**: дайте класу назву й опис і вкажіть кількість кімнат.
        2. **Модулі**: додайте потрібні класу інструменти (редактор коду, термінал, markdown, …) через **Додати модуль** або вставте URL модуля. Потім натисніть ⚙️ на кожному модулі, щоб налаштувати його: вміст і параметри, розмір і кімнати, в яких він з'являється.
        3. **Користувачі**: додайте викладачів за їхнім публічним ключем (кожен може скопіювати свій у меню ⋮). Залиште список студентів порожнім, щоб будь-хто з посиланням міг приєднатися.
        4. **Станції**: відкрийте посилання станції на пристрої (наприклад, ПК, під'єднаному до лабораторного обладнання). Він стане кімнатою, до якої можуть приєднатися студенти.
        5. **Поділитися**: завантажте резервну копію класу або відновіть її з файлу.

        **Запросіть інших:** поділіться посиланням на клас з адресного рядка браузера.

        ℹ️ Центрального сервера немає: ваш клас зберігається у вашому браузері, а всі під'єднуються безпосередньо одне до одного. Час від часу завантажуйте резервну копію в розділі **Поділитися**.

        📚 Більше інформації — у [документації](https://liascript.github.io/course/?https://raw.githubusercontent.com/edrys-labs/documentation/refs/heads/main/README.md).
      student: |
        # Ласкаво просимо 👋

        Ваш викладач ще не налаштував цей клас. Будь ласка, загляньте пізніше.
    ownership:
      owner: "Ви власник цього класу"
      teacher: "Ви тут викладач"
      student: "Ви тут студент"
    actions:
      cancel: "Скасувати"
      delete: "Видалити"
      deleteConfirm: "Ви впевнені?"
      deleteForever: "Так, видалити назавжди"
